[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencad-backend"
version = "0.2.1"
description = "OpenCAD HTTP backend — FastAPI transport over the OpenCAD core and agent"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# The only place FastAPI, httpx, and uvicorn are allowed.
dependencies = [
  "opencad==0.2.1",
  "opencad-agent[llm]==0.2.1",
  "fastapi>=0.100",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
occt = [
  "opencad[occt]",
]
stream = [
  "sse-starlette>=2.0",
]

[dependency-groups]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
opencad = { workspace = true }
opencad-agent = { workspace = true }
