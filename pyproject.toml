# Virtual workspace root. There is no package here — every distribution lives
# in a workspace member:
#
#   packages/opencad         core geometry kernel, solver, tree, fluent API
#   packages/opencad-agent   LLM agent, depends on the core
#   apps/backend             FastAPI transport, depends on both
#
# Sync everything for development:  uv sync --all-packages --group test
# Run the full suite:               uv run --all-packages python -m pytest

[tool.uv.workspace]
members = [
  "packages/opencad",
  "packages/opencad-agent",
  "apps/backend",
]

[tool.uv.sources]
opencad = { workspace = true }
opencad-agent = { workspace = true }

[dependency-groups]
test = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = [
  "packages/opencad/tests",
  "packages/opencad-agent/tests",
  "apps/backend/tests",
]
addopts = "-q"
