name: OCCT 106 Workspace
on:
  push:
    branches: [fix/occt-106-draft-neutral-plane]
    paths: [.github/workflows/occt-106-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'caid-technologies/OpenCAD' && github.ref == 'refs/heads/fix/occt-106-draft-neutral-plane'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENCAD_KERNEL_BACKEND: occt
      OPENCAD_SOLVER_BACKEND: python
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Verify staged changes match the locally tested bytes
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          patch = Path('.github/occt-106.patch').read_bytes().replace(b'\n diff --git ', b'\ndiff --git ')
          assert hashlib.sha256(patch).hexdigest() == '34aee3a05f79560f1977a4f808c5b7b939ef674bb9b5db2cc0c5bbb599df639a'
          Path('.github/occt-106.patch').write_bytes(patch)
          for name, digest in {
              'packages/opencad/tests/occt/test_draft.py': 'ceb18c2ee884e2293d3378b1d59a0c7110560d9b269b40c6bf02ee9f19b96aed',
              'docs/DRAFT.md': 'cea675472ae7265002943c712dcb8987892845ebb978efea8b74bfa27cebf68a',
          }.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
      - name: Apply draft changes
        run: |
          git apply --check .github/occt-106.patch
          git apply .github/occt-106.patch
          git diff --check
      - name: Verify real native draft and full geometry suite
        run: |
          uv venv --python 3.11 .venv-occt
          uv pip install --python .venv-occt -c scripts/occt-constraints.txt -e './packages/opencad[occt]' 'pytest>=8,<10'
          uv run --no-project --python .venv-occt python scripts/test_occt.py --strict-regressions -k draft
          uv run --no-project --python .venv-occt python scripts/test_occt.py
      - name: Commit only verified source changes to the issue branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/occt-106-draft-neutral-plane'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/OCCT_TESTING.md packages/opencad-agent/src/opencad_agent/prompting.py packages/opencad/src/opencad/kernel/core/occt_backend.py packages/opencad/src/opencad/kernel/operations/schemas.py packages/opencad/src/opencad/part.py packages/opencad/tests/occt/test_regressions.py
          git commit -m 'fix: use a validated neutral plane for OCCT draft (#106)'
          git push origin HEAD:refs/heads/fix/occt-106-draft-neutral-plane
