name: OCCT 108 Workspace
on:
  push:
    branches: [fix/occt-108-sweep-rebuild-references]
    paths: [.github/workflows/occt-108-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o opencad-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: occt-108-source
          path: opencad-source.zip
          retention-days: 1
