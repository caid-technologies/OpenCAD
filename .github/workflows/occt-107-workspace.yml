name: OCCT 107 Workspace
on:
  push:
    branches: [fix/occt-107-geometric-top-edges]
    paths: [.github/workflows/occt-107-workspace.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/occt-107-geometric-top-edges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Apply exact locally tested source and remove development transport
        run: python .apply_occt107.py
      - name: Verify native behavior and analytic refusal
        env:
          OPENCAD_KERNEL_BACKEND: occt
          OPENCAD_SOLVER_BACKEND: python
        run: |
          uv venv --python 3.11 .venv-occt
          uv pip install --python .venv-occt -c scripts/occt-constraints.txt -e './packages/opencad[occt]' 'pytest>=8,<10'
          uv run --no-project --python .venv-occt python scripts/test_occt.py
          uv run --no-project --python .venv-occt python -m pytest packages/opencad/tests/runtime/test_edge_selection.py
          git diff --check
      - name: Publish verified fix to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix: select native top edges by whole-edge geometry (#107)'
          git push origin HEAD:refs/heads/fix/occt-107-geometric-top-edges
