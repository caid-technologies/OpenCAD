[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencad"
version = "0.2.0"
description = "OpenCAD core — geometry kernel, constraint solver, feature tree, and fluent modelling API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Core only. No web framework, no HTTP client — see
# apps/backend/tests/test_core_boundary.py.
dependencies = [
  "pydantic>=2",
  "numpy>=2",
]

[project.scripts]
opencad = "opencad.cli:main"

[project.optional-dependencies]
occt = [
  "cadquery>=2.4",
  "cadquery-ocp>=7.7",
]
solver = [
  "scipy>=1.12",
]
graph = [
  "networkx>=3",
]
# Turntable preview export. `render` covers the primary GIF path and stays
# pure Python; `video` adds MP4 and its bundled ffmpeg binary, so the common
# case does not pay for a codec it will not use.
render = [
  "pillow>=10",
]
video = [
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
]
full = [
  "cadquery>=2.4",
  "cadquery-ocp>=7.7",
  "scipy>=1.12",
  "networkx>=3",
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
]

[dependency-groups]
# Both turntable encoders are in the test group so CI exercises the GIF and
# MP4 paths for real; the package itself keeps them optional.
test = [
  "pytest>=8",
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
